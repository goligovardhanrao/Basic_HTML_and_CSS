<!DOCTYPE html>
<html>
<head>
    <title>Class Attribute Assignment</title>

    <style>
        .blue-text {
            color: blue;
        }

        .center-text {
            text-align: center;
        }

        .myStyle {
            color: purple;
            text-decoration: underline;
            font-weight: bold;
        }
  
    </style>
</head>

<body>

    <p class="blue-text">This text is blue.</p>

    <p class="center-text">This text is centered.</p>


<p class="myStyle">This text is purple, underlined, and bold.</p>

    <p>This paragraph uses the normal style.</p>


</body>
</html>
