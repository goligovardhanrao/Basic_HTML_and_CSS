<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists</title>
    <link rel="stylesheet" type="text/css" href="CSS_Lists.css">
</head>
<body>

    <h1>My Lists</h1>

    <h2>My Favorite Foods</h2>
    <ul>
        <li>Pizza</li>
        <li>Sushi</li>
        <li>Tacos</li>
        <li>Burgers</li>
    </ul>

    <h2>My Morning Routine</h2>
    <ol>
        <li>Wake up</li>
        <li>Eat breakfast</li>
        <li>Get dressed</li>
        <li>Go to school</li>
    </ol>

</body>
</html>
