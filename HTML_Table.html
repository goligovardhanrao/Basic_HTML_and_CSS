<!DOCTYPE html>
<html>
<head>
    <title>HTML Table</title>
    <link rel="stylesheet" type="text/css" href="CSS_Table.css">
</head>
<body>

    <h1>My Favorite Foods</h1>

    <table>
        <tr>
            <th>Food</th>
            <th>Category</th>
            <th>Rating</th>
        </tr>
        <tr>
            <td>Pizza</td>
            <td>Italian</td>
            <td>5/5</td>
        </tr>
        <tr>
            <td>Sushi</td>
            <td>Japanese</td>
            <td>4/5</td>
        </tr>
        <tr>
            <td>Tacos</td>
            <td>Mexican</td>
            <td>5/5</td>
        </tr>
    </table>

</body>
</html>
